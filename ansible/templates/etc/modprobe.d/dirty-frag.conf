# This prevention to load modules track two sets of vulnerabilities:
# 1. Dirty Fragment CVEs (CVE-2026-43284 & CVE-2026-43500)
# 2. Fragnesia Linux kernel local privilege escalation vulnerability (CVE-2026-46300)
# Mitigate Dirty Fragment CVEs by preventing esp4, esp6, and rxrpc modules from loading.
# Mitigate Fragnesia Linux kernel local privilege escalation vulnerability by preventing esp4, esp6, and rxrpc modules from loading.
# These modules expose kernel fragmentation handling code that is vulnerable to Dirty Fragment and Fragnesia Linux kernel local privilege escalation vulnerability.
# Two directives are used per module for defence-in-depth:
#   blacklist -- prevents automatic loading by udev/hotplug (kernel modules)
#   install /bin/false -- blocks any load attempt (automatic or explicit modprobe)

# Block ESP over IPv4 (IPsec Encapsulating Security Payload - IPv4)
blacklist esp4
install esp4 /bin/false

# Block ESP over IPv6 (IPsec Encapsulating Security Payload - IPv6)
blacklist esp6
install esp6 /bin/false

# Block RXRPC (Reliable Datagram Sockets / AFS remote procedure call transport)
blacklist rxrpc
install rxrpc /bin/false