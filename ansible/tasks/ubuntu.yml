---
- name: Task specific to Ubuntu 22.04 and lower
  when: ansible_distribution_version is version('22.04', '<=')
  block:
    - name: Modify /bin/sh to point to bash instead of dash
      shell: "{{ item }}"
      with_items:
        - echo "dash dash/sh boolean false" |  debconf-set-selections
        - DEBIAN_FRONTEND=noninteractive dpkg-reconfigure dash

    - name: Force-remove ncat without cascading to tuned
      ansible.builtin.shell: |
        dpkg -r --force-depends ncat
        sed -i '/^Depends:/ s/, ncat//; /^Depends:/ s/ncat, //; /^Depends:/ s/ncat//' /var/lib/dpkg/status
      args:
        executable: /bin/bash

- name: Task specific to Ubuntu 24.04 and above
  when: ansible_distribution_version is version('24.04', '>=')
  block:
    - name: Modify /bin/sh to point to bash instead of dash - Ubuntu 24.04 and above
      ansible.builtin.file:
        src: bash
        dest: /bin/sh
        state: link

    - name: Mask lxd-installer socket unit
      ansible.builtin.systemd:
        masked: true
        state: stopped
        name: lxd-installer.socket

    - name: Disable apport service
      ansible.builtin.systemd:
        name: apport.service
        enabled: false
        state: stopped

    - name: "Remove telnet package"
      ansible.builtin.apt:
        name: "telnet"
        state: absent

- name: Mask systemd-timesyncd unit
  ansible.builtin.systemd:
    masked: true
    name: systemd-timesyncd.service

- name: add logrotate config for rsyslog
  copy:
    src: files/etc/logrotate.d/rsyslog_su
    dest: /etc/logrotate.d/rsyslog
    mode: 0644

- name: Ensure logrotate systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/logrotate.timer.d
    state: directory
    mode: "0755"

- name: update logrotate timer config
  copy:
    src: files/etc/logrotate.d/override.conf
    dest: /etc/systemd/system/logrotate.timer.d/override.conf
    mode: 0644
  register: timer_override_file

- name: Reload systemd daemon to recognize new configuration
  ansible.builtin.systemd:
    daemon_reload: true
  when: timer_override_file.changed

- name: Re-enable and start the logrotate timer
  ansible.builtin.systemd:
    name: logrotate.timer
    enabled: true
    state: restarted
  when: timer_override_file.changed
